name: x-wrt-23.06_b202307110013=ath79-generic

on: 
  release:
    types: [published]
  push:
    branches:
      - master
#  schedule:
#    - cron: 0 8 * * 5
#  watch:
#    types: [started]

jobs:
  build:
    if: github.event_name == 'release' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        images=$(docker images -q)
        if [ -n "$images" ]; then
          mapfile -t image_ids <<< "$images"
          docker rmi "${image_ids[@]}"
        fi
        echo "Deleting files, please wait ..."
        sudo -E apt-get update
        sudo -E apt-get -y install git
        if [ "$GITHUB_EVENT_NAME" != release ]; then
          git log -1 --pretty=%B | grep -q "^release:" || (echo "Stop build: not a release commit" >make.log && exit 1)
        fi
        sudo rm -rf \
          /usr/share/dotnet \
          /etc/mysql \
          /etc/php
        packages=$(dpkg-query -W -f='${db:Status-Status} ${binary:Package}\n' \
          azure-cli \
          'ghc*' \
          'zulu*' \
          hhvm \
          'llvm*' \
          firefox \
          'google*' \
          'dotnet*' \
          powershell \
          'openjdk*' \
          'mysql*' \
          'php*' 2>/dev/null || true)
        packages=$(printf '%s\n' "$packages" | awk '$1 == "installed" {print $2}')
        if [ -n "$packages" ]; then
          mapfile -t installed_packages <<< "$packages"
          sudo -E apt-get -y purge -- "${installed_packages[@]}"
        fi
        sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx-ucl libelf-dev autoconf automake libtool autopoint device-tree-compiler
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean

    - name: Clone source code
      run: git clone --depth 1 --branch "$(cat release.tag)" https://github.com/x-wrt/x-wrt.git

    - name: Update feeds
      run: cd x-wrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd x-wrt && ./scripts/feeds install -a

    - name: Building
      run: |
        cp ./*.sh x-wrt/
        cp release.tag x-wrt/
        cd x-wrt || exit
        echo "$(nproc) thread build."
        TARGET=ath79-generic sh build.sh "$(nproc)"

    - name : Upload make.log if failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-failure-log
        path: make.log

    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x-wrt-23.06_b202307110013=ath79-generic
        path: x-wrt/rom/
        if-no-files-found: error
