      uses: actions/download-artifact@v4
      with:
        name: release_url
        path: release_url
    - name: Get Release Upload URL
      id: get_release_info
      run: |
        value=`cat release_url/release_url.txt || cat release_url.txt`
        echo "upload_url=$value" >> $GITHUB_OUTPUT
      env:
        TAG_REF_NAME: ${{ github.ref }}
        REPOSITORY_NAME: ${{ github.repository }}
    - name: Upload Release Asset x-wrt-25.01_b202501010001-x86_64-docker
      id: asset-11803d4122c12a4ecf7ed1a2db9da311
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        github_token: ${{ secrets.WORKFLOW_TOKEN }}
        upload_url: ${{ steps.get_release_info.outputs.upload_url }}
        asset_path: /mnt/work/x-wrt/x-wrt-25.01_b202501010001-x86_64-docker.zip
        asset_name: x-wrt-25.01_b202501010001-x86_64-docker.zip
